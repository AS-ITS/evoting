# Codeception Test Suite Configuration
#
# Suite for acceptance tests.
# Perform tests in browser using the WebDriver or PhpBrowser.
# If you need both WebDriver and PHPBrowser tests - create a separate suite.

actor: AcceptanceTester
# 預設環境: 本地測試 (使用 PHP 內建服務器 - 在測試前執行: php -S localhost:8080 -t web)
modules:
    enabled:
        - PhpBrowser:
            url: 'http://localhost:8080/'
        - \Helper\Acceptance
        - \Codeception\Module\Asserts
        - Yii2:
            part: [orm, fixtures] # allow to use AR methods
            cleanup: false # don't wrap test in transaction
            entryScript: 'web/index-test.php'
            transaction: false
            configFile: 'config/test.php'
# 環境設定
env:
    ws:
        modules:
            enabled:
                - PhpBrowser:
                    url: 'https://dev.example.com/ws/voting/'
                - \Helper\Acceptance
                - Yii2:
                    part: [orm, fixtures] # allow to use AR methods
                    cleanup: false # don't wrap test in transaction
                    entryScript: 'web/index.php'
                    transaction: false # don't wrap test in transaction
                    configFile: 'config/test.php'
                    # transaction: false
    alpha:
        modules:
            enabled:
                - PhpBrowser:
                    url: 'https://voting.example.com/'
                - \Helper\Acceptance
                - Yii2:
                    part: [orm, fixtures] # allow to use AR methods
                    cleanup: false # don't wrap test in transaction
                    entryScript: 'web/index.php'
                    transaction: false